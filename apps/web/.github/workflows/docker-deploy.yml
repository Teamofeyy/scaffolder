name: Build & Push Docker image and Deploy

on:
  push:
    branches:
      - master

env:
  IMAGE: ${{ secrets.DOCKER_IMAGE }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get short SHA
        id: vars
        run: echo "SHA=$(echo ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.SHA }}

      - name: Deploy to server (SSH)
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      - name: Pull new image and restart on server
        run: |
          TAG=${{ steps.vars.outputs.SHA }}
          echo "Deploying image: $IMAGE:$TAG to ${{ secrets.SERVER_IP }}"

          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << EOF
            set -e
            cd /var/www/scaffolder || mkdir -p /var/www/scaffolder && cd /var/www/scaffolder

            # Опционально: записать тег в .env чтобы docker-compose его использовал
            echo "IMAGE=${IMAGE}" > .env
            echo "IMAGE_TAG=$TAG" >> .env

            # Подтянуть образ
            docker pull ${IMAGE}:$TAG

            # Обновить сервисы (docker compose должен быть установлен)
            docker compose pull
            docker compose up -d

            docker image prune -f
          EOF
        env:
          IMAGE: ${{ env.IMAGE }}