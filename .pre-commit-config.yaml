repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: api-rustfmt
        name: api rustfmt
        entry: bash -lc 'cd apps/api && cargo fmt --all --check'
        language: system
        pass_filenames: false

      - id: api-clippy
        name: api clippy
        entry: bash -lc 'cd apps/api && cargo clippy --workspace --all-targets -- -D warnings'
        language: system
        pass_filenames: false

      - id: frontend-eslint
        name: frontend eslint
        entry: bash -lc 'cd apps/web && npm run lint'
        language: system
        pass_filenames: false

      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -lc 'cd apps/web && npm run typecheck'
        language: system
        pass_filenames: false

        
