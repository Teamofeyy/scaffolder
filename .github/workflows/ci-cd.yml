name: ci-cd

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "22"
  RUST_VERSION: "1.88.0"
  TRIVY_DISABLE_VEX_NOTICE: "true"
  TRIVY_SKIP_VERSION_CHECK: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/api/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/api/Cargo.lock') }}-${{ hashFiles('apps/api/api/src/**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('apps/api/Cargo.lock') }}-
            ${{ runner.os }}-cargo-

      - name: Set up Python for pre-commit
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore pre-commit cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run backend tests
        run: pnpm exec turbo run test --filter=api

      - name: Run frontend unit and component tests
        run: pnpm --filter nextjs-scaffolder test

      - name: Build frontend
        run: pnpm run build:web

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm --filter nextjs-scaffolder exec playwright install --with-deps chromium

      - name: Run frontend E2E tests
        run: pnpm --filter nextjs-scaffolder test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.DOCKERHUB_USERNAME != ''

    permissions:
      contents: read

    env:
      BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/scaffolder-backend
      FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/scaffolder-frontend
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          load: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: |
            type=gha,scope=backend
            type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: |
            type=gha,scope=backend,mode=max
            type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          load: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: |
            type=gha,scope=frontend
            type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: |
            type=gha,scope=frontend,mode=max
            type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

      - name: Scan generated-project templates
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: apps/api/templates
          scanners: vuln
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: library
          severity: CRITICAL,HIGH
          skip-dirs: apps/api/templates/angular-ts,apps/api/templates/ember-ts,apps/api/templates/lit-ts,apps/api/templates/marko-ts,apps/api/templates/nuxt-ts,apps/api/templates/preact-ts,apps/api/templates/preact-ts-official,apps/api/templates/qwik-ts,apps/api/templates/solid-ts,apps/api/templates/svelte-ts

      - name: Scan backend image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          skip-dirs: /app/templates

      - name: Scan frontend image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate backend SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: backend-sbom.cdx.json
          skip-dirs: /app/templates

      - name: Generate frontend SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: cyclonedx
          output: frontend-sbom.cdx.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-sboms
          path: |
            backend-sbom.cdx.json
            frontend-sbom.cdx.json
          retention-days: 30

      - name: Push scanned images
        run: |
          docker tag "${BACKEND_IMAGE}:${IMAGE_TAG}" "${BACKEND_IMAGE}:latest"
          docker tag "${FRONTEND_IMAGE}:${IMAGE_TAG}" "${FRONTEND_IMAGE}:latest"
          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker push "${BACKEND_IMAGE}:latest"
          docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"
          docker push "${FRONTEND_IMAGE}:latest"

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/master'

    env:
      APP_DIR: ${{ secrets.VDS_APP_DIR }}
      BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/scaffolder-backend
      FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/scaffolder-frontend
      IMAGE_TAG: ${{ github.sha }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOMAIN: ${{ secrets.DOMAIN }}
      ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
      HTTP_PORT: "80"
      HTTPS_PORT: "443"
      AI_PROXY_URL: ${{ secrets.AI_PROXY_URL }}
      AI_PROXY_SECRET: ${{ secrets.AI_PROXY_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Upload deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          source: "compose.production.yaml,Caddyfile"
          target: ${{ env.APP_DIR }}
          overwrite: true

      - name: Deploy on VDS
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: ${{ env.APP_DIR }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ env.DOCKERHUB_TOKEN }}
          DOMAIN: ${{ env.DOMAIN }}
          ACME_EMAIL: ${{ env.ACME_EMAIL }}
          HTTP_PORT: ${{ env.HTTP_PORT }}
          HTTPS_PORT: ${{ env.HTTPS_PORT }}
          AI_PROXY_URL: ${{ env.AI_PROXY_URL }}
          AI_PROXY_SECRET: ${{ env.AI_PROXY_SECRET }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          envs: APP_DIR,BACKEND_IMAGE,FRONTEND_IMAGE,IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,DOMAIN,ACME_EMAIL,HTTP_PORT,HTTPS_PORT,AI_PROXY_URL,AI_PROXY_SECRET
          script: |
            set -euo pipefail
            cd "$APP_DIR"

            if [ -f .env ]; then
              cp .env .env.previous
            fi

            cat > .env <<EOF
            DOMAIN=$DOMAIN
            ACME_EMAIL=$ACME_EMAIL
            HTTP_PORT=$HTTP_PORT
            HTTPS_PORT=$HTTPS_PORT
            BACKEND_IMAGE=$BACKEND_IMAGE
            FRONTEND_IMAGE=$FRONTEND_IMAGE
            IMAGE_TAG=$IMAGE_TAG
            AI_PROXY_URL=$AI_PROXY_URL
            AI_PROXY_SECRET=$AI_PROXY_SECRET
            EOF

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose -f compose.production.yaml pull
            if ! docker compose -f compose.production.yaml up -d --remove-orphans --wait --wait-timeout 120; then
              echo "Deploy failed, collecting container diagnostics..."
              docker compose -f compose.production.yaml ps || true
              docker compose -f compose.production.yaml logs --no-color --tail=200 backend frontend caddy || true

              for service in backend frontend caddy; do
                container="scaffolder-$service"
                echo "===== inspect $container ====="
                docker inspect "$container" --format 'State: {{json .State}}' || true
                docker inspect "$container" --format 'Health: {{json .State.Health}}' || true
              done

              if [ -f .env.previous ]; then
                echo "Rolling back to previous deployment environment..."
                mv .env.previous .env
                docker compose -f compose.production.yaml up -d --remove-orphans --wait --wait-timeout 120 || true
                docker compose -f compose.production.yaml ps || true
              fi

              exit 1
            fi

            docker compose -f compose.production.yaml ps
            docker image prune -f
