name: ci-cd

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  NODE_VERSION: "22"
  RUST_VERSION: "1.88.0"

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Set up Python for pre-commit
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run backend tests
        run: pnpm exec turbo run test --filter=api

      - name: Build frontend
        run: pnpm run build:web

      - name: Build generator binary
        run: cargo build --manifest-path apps/api/api/Cargo.toml --release --locked

      - name: Upload generator binary
        uses: actions/upload-artifact@v7
        with:
          name: scaf-api-linux
          path: apps/api/target/release/scaf-api
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  generated-projects:
    name: generated / ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: react-none-css-modules
            framework: react
            routing: none
            styling: css-modules
            linting: eslint
          - name: react-none-tailwind
            framework: react
            routing: none
            styling: tailwind
            linting: eslint
          - name: react-router-css-modules
            framework: react
            routing: react-router
            styling: css-modules
            linting: eslint
          - name: react-router-tailwind
            framework: react
            routing: react-router
            styling: tailwind
            linting: eslint
          - name: react-router-data-css-modules
            framework: react
            routing: react-router-data
            styling: css-modules
            linting: eslint
          - name: react-router-data-tailwind
            framework: react
            routing: react-router-data
            styling: tailwind
            linting: eslint
          - name: vue-none-css-modules
            framework: vue
            routing: none
            styling: css-modules
            linting: none
          - name: vue-none-tailwind
            framework: vue
            routing: none
            styling: tailwind
            linting: none
          - name: vue-router-css-modules
            framework: vue
            routing: vue-router
            styling: css-modules
            linting: none
          - name: vue-router-tailwind
            framework: vue
            routing: vue-router
            styling: tailwind
            linting: none
          - name: next-app-css-modules
            framework: nextjs
            routing: app-router
            styling: css-modules
            linting: eslint
          - name: next-app-tailwind
            framework: nextjs
            routing: app-router
            styling: tailwind
            linting: eslint
          - name: next-pages-css-modules
            framework: nextjs
            routing: pages-router
            styling: css-modules
            linting: eslint
          - name: next-pages-tailwind
            framework: nextjs
            routing: pages-router
            styling: tailwind
            linting: eslint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download generator binary
        uses: actions/download-artifact@v8
        with:
          name: scaf-api-linux
          path: .artifacts

      - name: Verify generated project
        env:
          SCAFFOLDER_API_BINARY: ${{ github.workspace }}/.artifacts/scaf-api
          SCAFFOLDER_TEMPLATES_DIR: ${{ github.workspace }}/apps/api/templates
        run: |
          chmod +x "$SCAFFOLDER_API_BINARY" scripts/verify-generated-project.sh
          scripts/verify-generated-project.sh \
            "${{ matrix.name }}" \
            "${{ matrix.framework }}" \
            "${{ matrix.routing }}" \
            "${{ matrix.styling }}" \
            "${{ matrix.linting }}"

  docker:
    runs-on: ubuntu-latest
    needs:
      - quality
      - generated-projects
    if: github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''

    permissions:
      contents: read

    env:
      BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/scaffolder-backend
      FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/scaffolder-frontend
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.BACKEND_IMAGE }}:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.FRONTEND_IMAGE }}:buildcache,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/master'

    env:
      APP_DIR: ${{ secrets.VDS_APP_DIR }}
      BACKEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/scaffolder-backend
      FRONTEND_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/scaffolder-frontend
      IMAGE_TAG: ${{ github.sha }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOMAIN: ${{ secrets.DOMAIN }}
      ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
      HTTP_PORT: "80"
      HTTPS_PORT: "443"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Upload deployment files
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          source: "compose.production.yaml,Caddyfile"
          target: ${{ env.APP_DIR }}
          overwrite: true

      - name: Deploy on VDS
        uses: appleboy/ssh-action@v1
        env:
          APP_DIR: ${{ env.APP_DIR }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          DOCKERHUB_USERNAME: ${{ env.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ env.DOCKERHUB_TOKEN }}
          DOMAIN: ${{ env.DOMAIN }}
          ACME_EMAIL: ${{ env.ACME_EMAIL }}
          HTTP_PORT: ${{ env.HTTP_PORT }}
          HTTPS_PORT: ${{ env.HTTPS_PORT }}
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_PORT || 22 }}
          envs: APP_DIR,BACKEND_IMAGE,FRONTEND_IMAGE,IMAGE_TAG,DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,DOMAIN,ACME_EMAIL,HTTP_PORT,HTTPS_PORT
          script: |
            set -euo pipefail
            cd "$APP_DIR"

            cat > .env <<EOF
            DOMAIN=$DOMAIN
            ACME_EMAIL=$ACME_EMAIL
            HTTP_PORT=$HTTP_PORT
            HTTPS_PORT=$HTTPS_PORT
            BACKEND_IMAGE=$BACKEND_IMAGE
            FRONTEND_IMAGE=$FRONTEND_IMAGE
            IMAGE_TAG=$IMAGE_TAG
            EOF

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker compose -f compose.production.yaml pull
            if ! docker compose -f compose.production.yaml up -d --remove-orphans; then
              echo "Deploy failed, collecting container diagnostics..."
              docker compose -f compose.production.yaml ps || true
              docker compose -f compose.production.yaml logs --no-color --tail=200 backend frontend caddy || true

              for service in backend frontend caddy; do
                container="scaffolder-$service"
                echo "===== inspect $container ====="
                docker inspect "$container" --format 'State: {{json .State}}' || true
                docker inspect "$container" --format 'Health: {{json .State.Health}}' || true
              done
              exit 1
            fi

            docker compose -f compose.production.yaml ps
            docker image prune -f
